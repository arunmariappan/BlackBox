  - {id: nic-05, group: not_in_corpus, question: "What curriculum did the AlphaWeave agent use to learn knitting patterns?", expected_ending: max_attempts, status: draft, note: "fictional; check the index"}
  - {id: nic-06, group: not_in_corpus, question: "How do spiking neural networks handle attention on neuromorphic FPGAs in 2030 benchmarks?", expected_ending: max_attempts, status: draft, note: "check the index"}
  - {id: nic-07, group: not_in_corpus, question: "What loss function does the Orchid diffusion model use for 3D textile simulation?", expected_ending: max_attempts, status: draft, note: "fictional; check the index"}
  - {id: nic-08, group: not_in_corpus, question: "How is federated RLHF applied to tractor autopilots in the AgriLM paper?", expected_ending: max_attempts, status: draft, note: "fictional; check the index"}
