# BlackBox's committed defaults. Environment variables override them (BLACKBOX__SERVER__PORT=8300), and `.env` holds
# optional secrets. Everything listens on 127.0.0.1 and upstreams use 127.0.0.1, never localhost.

[server]
host = "127.0.0.1"
port = 8200                       # UI, REST API, OTLP at /v1/traces

[store]
path = "data/blackbox.db"

[ollama]                          # BlackBox's own calls (judges, descriptions, cluster names)
base_url = "http://127.0.0.1:11434"
model = "qwen3.5:4b"
timeout_seconds = 300

[runs]
quiet_seconds = 5                 # a run is complete this long after its root span ended and nothing new arrived
keep_unmatched = false            # keep traces that no profile matches (classic /ask, health checks)

[[proxy.upstreams]]
name = "ollama"
listen_port = 8210
target = "http://127.0.0.1:11434"
record_paths = ["/api/chat", "/api/generate", "/api/embed", "/v1/chat/completions"]
timeout_seconds = 600

[[proxy.upstreams]]
name = "opensearch"
listen_port = 8211
target = "http://127.0.0.1:9210"
record_paths = ["/*/_search"]

[[proxy.upstreams]]
name = "jina"
listen_port = 8212
target = "https://api.jina.ai"
record_paths = ["/v1/embeddings"]

[[proxy.upstreams]]
name = "opsdesk-env"
listen_port = 8213
target = "http://127.0.0.1:8221"
record_paths = ["/*"]
stateful = true

[proxy]
redact_headers = ["authorization", "x-api-key", "api-key", "cookie", "set-cookie", "proxy-authorization"]

[profiles.paperpilot]
base_url = "http://127.0.0.1:8100"
top_k = 3
use_hybrid = true
model = "qwen3.5:4b"              # PaperPilot's own default stays qwen3.5:9b; runs BlackBox starts ask for 4b

[profiles.opsdesk]
agent_url = "http://127.0.0.1:8220"
env_url = "http://127.0.0.1:8221"   # admin calls (sandboxes, checker); the agent's tools go through the proxy (8213)
model = "qwen3.5:4b"

[clusters]
embedder = "fastembed"            # BAAI/bge-small-en-v1.5 on the CPU, downloaded once into cache_dir
cache_dir = "data/models"
min_cluster_size = 3
onehot_weight = 0.5
recluster_after = 10              # unclustered failures that trigger a re-clustering

[live]
sources = ["live", "traffic"]     # runs the detectors watch (replays and suites are left out)
model_lane_max_wait_seconds = 600 # the model lane waits for agent calls in flight, at most this long per job
clear_evaluations = 2             # an alert resolves after this many clear evaluations in a row
cooldown_minutes = 30             # after closing, the same rule waits this long before it can open again
patch_minutes = 30                # default lifetime of a live patch

[live.rate_drop]
baseline_runs = 100
min_baseline = 30
window = 20
min_current = 8
design_drop = 0.3                 # the drop the CUSUM is tuned to catch quickly
threshold = 6.0                   # nats of evidence; lower is faster and noisier (docs/plan/phase-9)
delta = 0.15                      # reported with each alert: P(current < baseline - delta)

[live.shift]
k = 0.5
h = 5.0

[live.new_mode]
minutes = 30
growth = 3

[live.sampling.paperpilot]
judge_rate = 0.3
always_judge_flagged = true
max_judge_calls_per_hour = 60

[live.sampling.opsdesk]
judge_rate = 0.3
always_judge_flagged = true
max_judge_calls_per_hour = 60
