[project]
name = "blackbox"
version = "0.1.0"
description = "A flight recorder for AI agents: record, replay, fork, score and cluster agent runs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Arun Mariappan Karunanithi", email = "2525449+arunmariappan@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonpath-ng>=1.8.0",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-proto>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "plotly>=7.1.0",
    "protobuf>=7.36.2",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "sse-starlette>=3.5.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
blackbox = "blackbox.cli:app"
opsdesk = "opsdesk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackbox", "src/opsdesk"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["blackbox", "opsdesk"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fastembed.*", "sklearn.*", "scipy.*", "jsonpath_ng.*", "plotly.*", "sse_starlette.*", "ollama.*", "opentelemetry.*", "google.protobuf.*", "yaml.*", "psutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20260906",
]
